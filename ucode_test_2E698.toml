# discovery only finds jal return addresses. This ucode's real command
# dispatch (jr $8 in the loop at L_1000) reads targets out of a genuine data
# table in DMEM, which RSPRecomp can't see statically. Found empirically:
# every RSP task submitted at runtime hit "Unhandled jump target 0x148C",
# 100% reproducible, landing in a ~0xBC-byte gap between L_1420 and L_14DC
# that the generator never emitted code for at all. Add targets here as more
# are discovered the same way.
